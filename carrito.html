<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito — Gaia Bolivia Beauty</title>
  <link rel="stylesheet" href="css/base.css?v=20260430-1">
  <link rel="stylesheet" href="css/components.css?v=20260430-1">
  <link rel="stylesheet" href="css/layout.css?v=20260430-1">
  <style>
    /* ── Page header ── */
    .cart-header {
      background: linear-gradient(135deg, var(--color-bg-soft) 0%, var(--color-primary-pale) 100%);
      padding: 2rem 0;
    }
    .cart-header h1 { color: var(--color-text); font-size: 1.75rem; margin-bottom: .2rem; }
    .cart-header p  { color: var(--color-primary); font-size: .9rem; }

    /* ── Layout ── */
    .cart-layout {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 2rem; align-items: start;
      padding: 2rem 0 4rem;
    }
    @media (max-width: 900px) {
      .cart-layout { grid-template-columns: 1fr; }
    }
    #cart-summary { position: sticky; top: calc(var(--navbar-h) + 1rem); }

    /* ── Cart table ── */
    .cart-table { width: 100%; }

    .cart-table-head {
      display: grid;
      grid-template-columns: 88px 1fr 90px 130px 100px 36px;
      gap: .5rem 1rem;
      padding: .6rem .5rem;
      border-bottom: 2px solid var(--border);
      font-size: .68rem; font-weight: 600;
      letter-spacing: .1em; text-transform: uppercase;
      color: var(--text-light);
    }
    .cart-table-head span:nth-child(3),
    .cart-table-head span:nth-child(4) { text-align: center; }
    .cart-table-head span:nth-child(5) { text-align: right; }

    .cart-row {
      display: grid;
      grid-template-columns: 88px 1fr 90px 130px 100px 36px;
      gap: .5rem 1rem;
      align-items: center;
      padding: 1.1rem .5rem;
      border-bottom: 1px solid var(--border);
      transition: background var(--transition);
    }
    .cart-row:hover { background: rgba(200,169,110,.03); }

    .cart-row__img img {
      width: 80px; height: 80px; object-fit: cover;
      border-radius: var(--radius); background: var(--accent); display: block;
    }
    .cart-row__name {
      font-family: var(--font-heading);
      font-size: 1rem; font-weight: 600; color: var(--secondary);
      margin-bottom: .15rem;
    }
    .cart-row__variant { font-size: .78rem; color: var(--text-light); }
    .cart-row__price   { text-align: center; font-size: .9rem; color: var(--text-light); }
    .cart-row__subtotal {
      text-align: right; font-weight: 600;
      color: var(--primary-dark); font-size: .95rem;
    }
    .cart-row__qty {
      display: flex; align-items: center; justify-content: center; gap: .4rem;
    }
    .cart-row__remove { display: flex; justify-content: flex-end; }

    /* Mobile: 3-col grid with areas */
    @media (max-width: 640px) {
      .cart-table-head { display: none; }
      .cart-row {
        grid-template-columns: 72px 1fr auto;
        grid-template-areas:
          "img info  remove"
          "img qty   subtotal";
        gap: .4rem .75rem;
        padding: .9rem .25rem;
      }
      .cart-row__img     { grid-area: img; }
      .cart-row__info    { grid-area: info; }
      .cart-row__remove  { grid-area: remove; align-self: start; }
      .cart-row__qty     { grid-area: qty; justify-content: flex-start; }
      .cart-row__subtotal{ grid-area: subtotal; text-align: right; }
      .cart-row__price   { display: none; }
      .cart-row__img img { width: 64px; height: 64px; }
    }

    /* ── WhatsApp FAB ── */
    .whatsapp-fab {
      position: fixed; bottom: 1.75rem; right: 1.75rem; z-index: 1000;
      width: 56px; height: 56px; background: #25d366; border-radius: 50%;
      display: none; align-items: center; justify-content: center;
      font-size: 1.6rem; box-shadow: 0 4px 18px rgba(37,211,102,.4);
      text-decoration: none; transition: transform var(--transition), box-shadow var(--transition);
    }
    .whatsapp-fab:hover { transform: scale(1.1); }
  </style>
</head>
<body data-page="carrito">

  <!-- Navbar -->
  <nav class="navbar" role="navigation" aria-label="Navegación principal">
    <div class="navbar__inner">
      <a href="index.html" class="navbar__logo">
        <img src="assets/gaia-logo.svg" alt="Gaia Bolivia" onerror="this.style.display='none'">
      </a>
      <ul class="navbar__nav" role="list">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="tienda.html">Tienda</a></li>
        <li><a href="tienda.html?category=vestidos">Vestidos</a></li>
        <li><a href="tienda.html?category=blusas">Blusas &amp; Tops</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
      <div class="navbar__actions">
        <a href="carrito.html" class="cart-btn" aria-label="Ver carrito">
          🛒 <span class="badge" id="cart-badge" style="display:none">0</span>
        </a>
        <button class="hamburger" aria-label="Menú" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>
  <div class="mobile-nav">
    <a href="index.html">Inicio</a>
    <a href="tienda.html">Tienda</a>
    <a href="carrito.html">🛒 Carrito</a>
  </div>

  <main class="page-content">

    <div class="cart-header">
      <div class="container">
        <h1>🛒 Mi Carrito</h1>
        <p>Revisa y confirma tus productos antes de pagar</p>
      </div>
    </div>

    <div class="container">
      <!-- Steps indicator -->
      <div class="steps" style="margin:1.75rem 0">
        <div class="step active">
          <div class="step__dot">1</div>
          <span class="step__label">Carrito</span>
        </div>
        <div class="step-line"></div>
        <div class="step">
          <div class="step__dot">2</div>
          <span class="step__label">Datos</span>
        </div>
        <div class="step-line"></div>
        <div class="step">
          <div class="step__dot">3</div>
          <span class="step__label">Pago</span>
        </div>
        <div class="step-line"></div>
        <div class="step">
          <div class="step__dot">4</div>
          <span class="step__label">Confirmación</span>
        </div>
      </div>

      <div class="cart-layout">
        <div>
          <div id="cart-items"></div>
        </div>
        <aside id="cart-summary"></aside>
      </div>
    </div>

  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer__bottom">
        <span>© 2025 Gaia Bolivia Beauty. Todos los derechos reservados.</span>
        <a href="tienda.html" style="color:var(--color-primary)">← Seguir comprando</a>
      </div>
    </div>
  </footer>

  <a class="whatsapp-fab" href="#" data-whatsapp aria-label="WhatsApp">💬</a>

  <script src="js/api.js?v=20260430-1"></script>
  <script src="js/cart.js?v=20260430-1"></script>
  <script src="js/app.js?v=20260430-1"></script>
</body>
</html>
